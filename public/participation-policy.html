<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>参加ポリシー</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 720px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      color: #1a1a1a;
      line-height: 1.7;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
    }

    h2 {
      font-size: 1.1rem;
      margin-top: 2rem;
      margin-bottom: 0.5rem;
    }

    p {
      margin: 0.5rem 0;
    }
  </style>
</head>

<body>
  <h1>参加ポリシー</h1>
  <p>本イベントへご参加いただく前に、以下の内容をご確認ください。</p>

  <h2>参加費について</h2>
  <p>参加費はイベントごとに異なります。エントリー時に表示される金額をご確認のうえお申し込みください。</p>

  <h2>キャンセルについて</h2>
  <p>エントリー締切（締切が設定されていない場合はイベント開始日時）以降は、システム上エントリー内容の変更・キャンセルができません。締切後にやむを得ずキャンセルが必要になった場合は、お手数ですが運営までご連絡ください。</p>

  <h2>その他</h2>
  <p>セッションの様子（写真・動画等）をSNS等に掲載させていただく場合があります。掲載への同意可否はエントリー時に任意でお選びいただけます。</p>
</body>

</html>
