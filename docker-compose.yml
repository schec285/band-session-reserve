services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: band_session
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d band_session"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      target: builder
    command: npx drizzle-kit migrate --config drizzle.config.ts
    environment:
      DATABASE_URL: postgresql://dev:dev@db:5432/band_session
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://dev:dev@db:5432/band_session
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
