services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: band_session
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://dev:dev@db:5432/band_session
      SESSION_SECRET: ${SESSION_SECRET}
      API_TOKEN_SECRET: ${API_TOKEN_SECRET}
    depends_on:
      - db

volumes:
  postgres_data:
